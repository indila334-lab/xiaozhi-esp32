name: Severin Xingzhi Cube Build

on:
  push:
    branches:
      - severin-local-bridge-save
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build xingzhi-cube-0.96oled-ml307
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Severin cube firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py xingzhi-cube-0.96oled-ml307

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: severin_xingzhi_cube_0.96oled_ml307_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
